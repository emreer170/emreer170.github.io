<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perde Arkası — Arkadaş Daveti</title>
<meta name="robots" content="noindex">
<!-- Kod adresin # kısmında durur: tarayıcı onu sunucuya hiç göndermez. -->
<style>
:root{--bg:#fbf8f3;--fg:#1d1a20;--muted:#6b6370;--card:#fff;--line:#e4dcd0;--accent:#b5473a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121014;--fg:#eee8e0;--muted:#a59ca8;--card:#1d1a22;--line:#34303a;--accent:#d8644f;--on:#1a0f0d}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin:0 auto;padding:32px 16px 48px;line-height:1.5;color:var(--fg);background:var(--bg);text-align:center}
h1{font-size:1.5rem;margin:.2em 0 .6em}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.35rem;font-weight:700;letter-spacing:.04em;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;margin:0 0 14px}
button{font:inherit;font-weight:700;font-size:1.1rem;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:var(--on);cursor:pointer}
.ok{color:var(--accent);font-weight:700;min-height:1.6em;margin:8px 0 0}
ol{text-align:left;color:var(--muted);padding-left:1.3em;margin:22px 0}
.stores{display:flex;gap:10px;margin-top:8px}
.stores a{flex:1;display:block;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600;background:var(--card)}
.none{color:var(--muted)}
</style>
</head><body>
<h1>Perde Arkası'nda arkadaş daveti 🎭</h1>
<div id="has">
  <div class="code" id="code"></div>
  <button id="copy" type="button">Kodu Kopyala</button>
  <p class="ok" id="ok" aria-live="polite"></p>
  <ol>
    <li>Perde Arkası'nı aç.</li>
    <li><b>Arkadaşlar → Arkadaş Ekle → Arkadaşının Kodunu Gir</b>.</li>
    <li><b>Panodan Yapıştır</b>'a dokun. Hepsi bu.</li>
  </ol>
</div>
<p class="none" id="none" hidden>Bu bağlantıda davet kodu yok. Kodu, gönderen arkadaşından yeniden iste.</p>
<p>Oyun sende yok mu?</p>
<div class="stores">
  <a href="https://apps.apple.com/app/id6829558493">App Store</a>
  <a href="https://play.google.com/store/apps/details?id=com.ercogames.sahne">Google Play</a>
</div>
<script>
(function(){
  var raw=decodeURIComponent((location.hash||'').slice(1)).trim().toUpperCase();
  // Yalnızca Perde Arkası arkadaş kodu biçimi kabul edilir; başka bir şey yazılmaz.
  var ok=/^PERDE-[AF](-[0-9A-Z]{1,5})+$/.test(raw);
  if(!ok){document.getElementById('has').hidden=true;document.getElementById('none').hidden=false;return;}
  document.getElementById('code').textContent=raw;
  var msg=document.getElementById('ok');
  function fallback(){
    var r=document.createRange();r.selectNodeContents(document.getElementById('code'));
    var s=getSelection();s.removeAllRanges();s.addRange(r);
    try{document.execCommand('copy');msg.textContent='Kopyalandı! Şimdi uygulamada yapıştır.';}
    catch(e){msg.textContent='Kod seçildi; uzun basıp Kopyala de.';}
  }
  document.getElementById('copy').onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(raw).then(function(){msg.textContent='Kopyalandı! Şimdi uygulamada yapıştır.';},fallback);
    }else fallback();
  };
})();
</script>
</body></html>
